# cargo-deny: licences, sources, banned crates and advisories for the Showcase
# workspace. Runs inside the NoWayOS dev container: `make deny` (or
# `make ci`).
#
# House licence list: MIT, Apache-2.0,
# BSD-2-Clause, BSD-3-Clause, ISC. Anything else the dependency tree needs
# gets a per-crate exception below, and needs the project owner's written
# sign-off before it is relied on.

[graph]
# Every platform: stricter than checking only the platforms we build for.
targets = []
all-features = false
no-default-features = false

[advisories]
# Every vulnerability, unsound and unmaintained advisory is an error, whichever
# crate in the tree it concerns, and so is a yanked crate version, unless it is
# listed in `ignore` with the reason it does not apply. (By default cargo-deny
# fails an unsound advisory only for a direct dependency, and only warns about
# a yanked version.)
unmaintained = "all"
unsound = "all"
yanked = "deny"
ignore = []

[licenses]
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC"]
confidence-threshold = 0.93
# Check dev-dependencies too: the house rule covers every package we add.
include-dev = true
# The allow list is the house policy shared by every NoWayOS repo; not
# every licence on it is used here.
unused-allowed-license = "allow"
# Per-crate exceptions for any other licence go here: one
# [[licenses.exceptions]] table per crate, with the comment
# "outside house list - flagged to project owner for sign-off". There are none
# today.
#
# Noted, not excepted: Cargo.lock also lists unicode-ident, whose licence is
# "(MIT OR Apache-2.0) AND Unicode-3.0" - outside house list; Unicode-3.0 was
# signed off for every repo on 2026-10-01. It is reachable only
# through the proptest dev-dependency (rand_chacha -> ppv-lite86 -> zerocopy, whose dependency on
# zerocopy-derive -> syn -> proc-macro2 -> unicode-ident sits under cfg(any()),
# a condition no target satisfies), so it is never built and cargo-deny leaves
# it out of the graph. If it ever becomes a real dependency this check fails
# until a per-crate exception with its sign-off is added.

exceptions = [
    # outside house list - signed off: nowayos-glyphs, NoWayOS's glyph
    # atlases, a Modified Version of the signed-off font, is OFL-1.1.
    { crate = "nowayos-glyphs", allow = ["OFL-1.1"] },
]

[licenses.private]
# Our own crates and NoWayOS's declare their licences and are checked like any
# other crate. Third-party code still comes from crates.io only: `make deny`
# first runs the NoWayOS baseline check (../nowayos/tools/check-baseline),
# whose local-crate guard fails on any local crate that is not Showcase's or
# NoWayOS's own.
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Showcase depends on NoWayOS by path, at the commit nowayos.rev records;
# path dependencies of unpublished crates are not treated as wildcards.
allow-wildcard-paths = true
# The NoWayOS baseline's bans (nowayos/tools/baseline.toml): the
# trusted path has no browser engine, WebView, window system or C GUI
# runtime (non-negotiables), so their usual crates
# are banned by name in every workspace. `make deny` fails if one is missing
# or banned only in part, if [graph] narrows what cargo-deny checks, or if
# Cargo.lock - every feature and platform - holds one, so none can arrive as
# a dependency of something else.
deny = [
    { crate = "wry", reason = "trusted-path non-negotiable: no WebView" },
    { crate = "webkit2gtk", reason = "trusted-path non-negotiable: no browser engine" },
    { crate = "webkit2gtk-sys", reason = "trusted-path non-negotiable: no browser engine" },
    { crate = "webview2-com", reason = "trusted-path non-negotiable: no WebView" },
    { crate = "servo", reason = "trusted-path non-negotiable: no browser engine" },
    { crate = "tao", reason = "trusted-path non-negotiable: no window system" },
    { crate = "winit", reason = "trusted-path non-negotiable: no window system" },
    { crate = "x11", reason = "trusted-path non-negotiable: no window system" },
    { crate = "x11-dl", reason = "trusted-path non-negotiable: no window system" },
    { crate = "x11rb", reason = "trusted-path non-negotiable: no window system" },
    { crate = "wayland-client", reason = "trusted-path non-negotiable: no window system" },
    { crate = "wayland-sys", reason = "trusted-path non-negotiable: no window system" },
    { crate = "gtk", reason = "trusted-path non-negotiable: no C GUI runtime" },
    { crate = "gtk4", reason = "trusted-path non-negotiable: no C GUI runtime" },
    { crate = "gtk-sys", reason = "trusted-path non-negotiable: no C GUI runtime" },
    { crate = "sdl2", reason = "trusted-path non-negotiable: no C GUI runtime" },
    { crate = "sdl2-sys", reason = "trusted-path non-negotiable: no C GUI runtime" },
    { crate = "minifb", reason = "trusted-path non-negotiable: no window system" },
    # Showcase's own: libFuzzer is signed off for development and CI
    # fuzzing only, in fuzz/'s own workspace and lock.
    { crate = "libfuzzer-sys", reason = "fuzzing only, in fuzz/'s own workspace - never in a workspace that ships" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# No git dependencies here. rust-sel4 is the only git source the project
# allows, and only for the protection-domain workspaces: NoWayOS's and
# Showcase's own (pds/deny.toml).
allow-git = []
