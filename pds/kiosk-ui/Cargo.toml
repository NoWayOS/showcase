[package]
name = "showcase-kiosk-ui"
description = "The reference kiosk's UI PD: the kiosk reference screens on NoWayOS's UI loop, driven by the kiosk flow in the application PD over the app-UI contract"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# A library, so that the showcase's UI PD (showcase-ui) runs the
# same PD on its own screens, and the program for the reference
# kiosk.
[lib]
path = "src/lib.rs"
test = false
doctest = false
bench = false

[[bin]]
name = "showcase-kiosk-ui"
path = "src/main.rs"
test = false
bench = false

[dependencies]
showcase-kiosk-contract.workspace = true
showcase-kiosk-screens.workspace = true
nowayos-bounded.workspace = true
nowayos-display.workspace = true
nowayos-ipc.workspace = true
nowayos-region.workspace = true
nowayos-timer-api.workspace = true
nowayos-ui.workspace = true
nowayos-ui-loop.workspace = true
sel4-microkit.workspace = true

[lints]
workspace = true
